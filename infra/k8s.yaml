apiVersion: v1
kind: Namespace
metadata:
  name: efrei-big-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: efrei-big-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: efrei-big-data
data:
  init-db.sql: |
    CREATE DATABASE airflow_metadata;
    CREATE USER airflow WITH PASSWORD 'airflow';
    GRANT ALL PRIVILEGES ON DATABASE airflow_metadata TO airflow;
    \c airflow_metadata
    GRANT ALL ON SCHEMA public TO airflow;

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efrei-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data-pvc
        - name: init-scripts
          configMap:
            name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: efrei-big-data
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: airflow
          image: registry.gitlab.com/val-team/public/efrei-big-data/airflow:latest
          imagePullPolicy: Always
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@postgres:5432/airflow_metadata"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS
              value: "admin:admin,invit:viewer"
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efrei-secrets
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: AIRFLOW_INVIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efrei-secrets
                  key: AIRFLOW_INVIT_PASSWORD
            - name: HDFS_URI
              value: "hdfs://namenode:9000"
            - name: HDFS_USER
              value: "root"
            - name: AIRFLOW_CONN_SPARK_DEFAULT
              value: '{"conn_type":"spark","host":"spark://spark-master","port":7077}'
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: airflow-logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: airflow-logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: efrei-big-data
spec:
  selector:
    app: airflow
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-ingress
  namespace: efrei-big-data
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - efrei-bigdata-airflow.valentin-massonniere.ch
      secretName: airflow-tls
  rules:
    - host: efrei-bigdata-airflow.valentin-massonniere.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: efrei-big-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: registry.gitlab.com/val-team/public/efrei-big-data/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: efrei-big-data
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: efrei-big-data
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - efrei-bigdata-api.valentin-massonniere.ch
      secretName: api-tls
  rules:
    - host: efrei-bigdata-api.valentin-massonniere.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
  namespace: efrei-big-data
data:
  CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
  CORE_CONF_hadoop_http_staticuser_user: "root"
  CORE_CONF_hadoop_proxyuser_root_hosts: "*"
  CORE_CONF_hadoop_proxyuser_root_groups: "*"
  CORE_CONF_io_compression_codecs: "org.apache.hadoop.io.compress.SnappyCodec"
  HDFS_CONF_dfs_webhdfs_enabled: "true"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
  HDFS_CONF_dfs_replication: "1"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: namenode-data-pvc
  namespace: efrei-big-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datanode-data-pvc
  namespace: efrei-big-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: namenode
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      containers:
        - name: namenode
          image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
          env:
            - name: CLUSTER_NAME
              value: "bigdata-vps"
          envFrom:
            - configMapRef:
                name: hadoop-config
          ports:
            - containerPort: 9870
            - containerPort: 9000
          volumeMounts:
            - name: namenode-storage
              mountPath: /hadoop/dfs/name
          readinessProbe:
            httpGet:
              path: /
              port: 9870
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: namenode-storage
          persistentVolumeClaim:
            claimName: namenode-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: namenode
  namespace: efrei-big-data
spec:
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 9000
      targetPort: 9000
    - name: ui
      port: 9870
      targetPort: 9870

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanode
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
    spec:
      containers:
        - name: datanode
          image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
          env:
            - name: SERVICE_PRECONDITION
              value: "namenode:9870"
          envFrom:
            - configMapRef:
                name: hadoop-config
          ports:
            - containerPort: 9864
          volumeMounts:
            - name: datanode-storage
              mountPath: /hadoop/dfs/data
      volumes:
        - name: datanode-storage
          persistentVolumeClaim:
            claimName: datanode-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: datanode
  namespace: efrei-big-data
spec:
  selector:
    app: datanode
  ports:
    - port: 9864
      targetPort: 9864

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: spark-master
          image: registry.gitlab.com/val-team/public/efrei-big-data/spark:latest
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
            - --host
            - 0.0.0.0
          env:
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7077
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: efrei-big-data
spec:
  selector:
    app: spark-master
  ports:
    - name: rpc
      port: 7077
      targetPort: 7077
    - name: ui
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: spark-worker
          image: registry.gitlab.com/val-team/public/efrei-big-data/spark:latest
          imagePullPolicy: Always
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - --memory
            - 1G
            - --cores
            - "1"
            - spark://spark-master:7077
          env:
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
