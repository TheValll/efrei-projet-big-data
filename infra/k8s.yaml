apiVersion: v1
kind: Namespace
metadata:
  name: efrei-big-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-data-pvc
  namespace: efrei-big-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: efrei-big-data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: airflow
          image: registry.gitlab.com/val-team/public/efrei-big-data/airflow:latest
          imagePullPolicy: Always
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "SequentialExecutor"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "sqlite:////opt/airflow/airflow.db"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS
              value: "admin:admin,invit:viewer"
            - name: AIRFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efrei-secrets
                  key: AIRFLOW_ADMIN_PASSWORD
            - name: AIRFLOW_INVIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: efrei-secrets
                  key: AIRFLOW_INVIT_PASSWORD
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: airflow-db
              mountPath: /opt/airflow/airflow.db
              subPath: airflow.db
            - name: airflow-logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: airflow-db
          persistentVolumeClaim:
            claimName: airflow-data-pvc
        - name: airflow-logs
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: efrei-big-data
spec:
  selector:
    app: airflow
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-ingress
  namespace: efrei-big-data
spec:
  rules:
    - host: efrei-bigdata-airflow.valentin-massonniere.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: efrei-big-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: registry.gitlab.com/val-team/public/efrei-big-data/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: efrei-big-data
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: efrei-big-data
spec:
  rules:
    - host: efrei-bigdata-api.valentin-massonniere.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
